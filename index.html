<style>
  :root{
    --bg:#0a0a0a; --surface:#141210; --surface-2:#1d1a15; --surface-3:#242019;
    --accent:#e6b23c; --accent-soft:rgba(230,178,60,.14); --accent-soft-2:rgba(230,178,60,.07);
    --text:#f5f5f0; --text-muted:#9a9a94; --border:rgba(245,245,240,.09); --border-strong:rgba(245,245,240,.16);
    --free-neon:#f4ff2e; --free-neon-glow:rgba(244,255,46,.45); --busy-bg:rgba(245,245,240,.06);
    --personal:#7ad1e6;
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Golos Text',system-ui,-apple-system,sans-serif;padding-inline:16px;padding-block:20px 40px;}
  .page{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .brand-left{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .brand-mark{font-family:'Russo One',sans-serif;font-size:28px;letter-spacing:.5px;color:var(--accent);}
  .brand-sub{font-size:13px;color:var(--text-muted);}
  .mode-buttons{display:flex;gap:8px;flex-wrap:wrap;}
  .mode-btn{padding:8px 12px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-muted);font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .mode-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  .voice-row{display:none;}
  .voice-row.show{display:flex;gap:8px;align-items:center;}
  .mic-btn{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:24px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .mic-btn.listening{background:#b5514a;border-color:#e07a72;color:#fff;animation:micPulse 1.1s ease-in-out infinite;}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,122,114,.5);}50%{box-shadow:0 0 0 10px rgba(224,122,114,0);}}
  .voice-hint{font-size:12px;color:var(--text-muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin:-2px 0 2px;}

  .month-tabs{display:flex;gap:6px;overflow-x:auto;padding-block:2px 4px;scrollbar-width:thin;}
  .month-tabs::-webkit-scrollbar{height:4px;}
  .month-tabs::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
  .month-tab{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .month-tab.active{background:var(--accent);border-color:var(--accent);color:#1a1206;}

  .month-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:12px 14px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:13px;color:var(--text-muted);}
  .month-summary b{color:var(--text);font-variant-numeric:tabular-nums;}
  .month-summary .stat{display:flex;flex-direction:column;gap:2px;}
  .month-summary .stat span:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.4px;}

  .day-list{display:flex;flex-direction:column;gap:6px;}
  .day-row{display:flex;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);}
  .day-row.weekend{background:var(--accent-soft-2);}
  .day-row.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .day-row.free{border-color:rgba(244,255,46,.5);background:rgba(244,255,46,.06);box-shadow:0 0 16px rgba(244,255,46,.14);}
  .day-date{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
  .day-num{font-family:'Russo One',sans-serif;font-size:20px;font-variant-numeric:tabular-nums;line-height:1;}
  .day-dow{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;}
  .day-row.weekend .day-num{color:var(--accent);}
  .day-entries{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .entry{border-left:3px solid var(--accent);padding:4px 0 4px 10px;cursor:pointer;border-radius:0 8px 8px 0;}
  .entry:hover{background:var(--surface-2);}
  .entry-main{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:14px;}
  .entry-time{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;}
  .entry-client{font-weight:600;}
  .entry-price{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text);font-weight:600;}
  .entry-sub{font-size:12px;color:var(--text-muted);margin-top:2px;word-break:break-word;}
  .entry-personal{border-left-color:var(--personal);}
  .entry-personal .entry-time{color:var(--personal);}
  .entry-personal:not([onclick]):hover{background:none;cursor:default;}
  .entry-readonly{font-size:14px;color:var(--text-muted);padding:4px 0 4px 10px;border-left:3px solid var(--border-strong);}
  .day-add-btn{font:inherit;font-size:13px;color:var(--accent);background:none;border:1px dashed var(--border-strong);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left;width:fit-content;}
  .day-empty-btn{font:inherit;font-size:14px;font-weight:700;letter-spacing:.2px;color:#1a1206;background:var(--free-neon);border:1px solid var(--free-neon);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;width:fit-content;box-shadow:0 0 14px var(--free-neon-glow),0 0 2px rgba(244,255,46,.9);}
  .day-status{font-size:13px;color:var(--text-muted);padding:8px 0;}
  .day-status.free-label{color:var(--free-neon);font-weight:700;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;}
  .modal-overlay[hidden]{display:none;}
  .modal-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:16px 16px 12px 12px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;max-height:88vh;overflow-y:auto;}
  .modal-box h3{font-family:'Russo One',sans-serif;font-size:16px;color:var(--accent);margin:0 0 4px;font-weight:400;}
  .modal-box label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-muted);}
  .modal-box input,.modal-box select,.modal-box textarea{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;}
  .modal-box textarea{resize:vertical;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap;}
  .btn-accent{padding:9px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#1a1206;font:inherit;font-weight:700;font-size:13px;cursor:pointer;}
  .btn-ghost{padding:9px 14px;border-radius:10px;border:1px solid var(--border-strong);background:none;color:var(--text-muted);font:inherit;font-size:13px;cursor:pointer;}
  .btn-danger{padding:9px 14px;border-radius:10px;border:1px solid #b5514a;background:none;color:#e07a72;font:inherit;font-size:13px;cursor:pointer;margin-right:auto;}

  .cta{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding:20px 18px;background:var(--surface);border:1px solid var(--border);border-radius:16px;}
  .cta h2{font-family:'Russo One',sans-serif;font-size:17px;font-weight:400;color:var(--text);margin:0;}
  .cta p{font-size:13px;color:var(--text-muted);margin:0;max-width:440px;}
  .cta-buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
  .btn{padding:11px 18px;border-radius:10px;font:inherit;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn-y{background:var(--accent);color:#1a1206;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90%;background:var(--surface-3);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;text-align:center;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .toast[hidden]{display:none;}
  .note{font-size:12px;color:var(--text-muted);text-align:center;padding-block:8px 4px;}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <div class="brand-left">
        <span class="brand-mark">VOODOO</span>
        <span class="brand-sub" id="brandSub">Свободные даты записи</span>
      </div>
      <div class="mode-buttons">
        <button class="mode-btn" id="masterBtn" onclick="onMasterBtnClick()">Войти как мастер</button>
        <button class="mode-btn" id="secBtn" onclick="onSecBtnClick()">Секретарь</button>
      </div>
    </div>
    <div class="voice-row" id="voiceRow">
      <button class="mic-btn" id="voiceBtn" onclick="toggleVoiceCommand()">🎤 Голосом</button>
    </div>
    <div class="month-tabs" id="monthTabs"></div>
    <div class="month-summary" id="monthSummary" hidden></div>
  </header>

  <section>
    <div class="day-list" id="dayList"></div>
  </section>

  <div class="cta" id="ctaBlock">
    <h2>Записаться</h2>
    <p>Напиши в любой удобный мессенджер — согласуем дату, идею и стоимость.</p>
    <div class="cta-buttons">
      <a class="btn btn-y" href="https://t.me/VOODOOSTUDIO" target="_blank" rel="noopener">Telegram</a>
      <a class="btn btn-ghost" href="https://vk.ru/voodookrsk" target="_blank" rel="noopener">ВКонтакте</a>
      <a class="btn btn-ghost" href="tel:+79234203338">МАКС +7 923 420-33-38</a>
    </div>
  </div>

  <footer class="note" id="footNote">Страница обновляется в реальном времени.</footer>
</div>

<div class="modal-overlay" id="pinModal" hidden>
  <div class="modal-box">
    <h3 id="pinModalTitle">Режим мастера</h3>
    <label>Пинкод<input type="password" inputmode="numeric" id="pinInput" placeholder="••••"></label>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closePinModal()">Отмена</button>
      <button class="btn-accent" onclick="submitPin()">Войти</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="entryModal" hidden>
  <div class="modal-box">
    <h3 id="modalTitle">Новая запись</h3>
    <div class="voice-hint" id="modalVoiceHint" hidden></div>
    <label>Дата<input type="date" id="mDate"></label>
    <label>Время<input type="time" id="mTime"></label>
    <label>Клиент<input type="text" id="mClient" placeholder="Имя"></label>
    <label>Откуда клиент
      <select id="mSource">
        <option value="VK">ВКонтакте</option>
        <option value="TG">Telegram</option>
        <option value="WA">WhatsApp</option>
        <option value="MAX">МАКС</option>
      </select>
    </label>
    <label>Цена, ₽<input type="number" id="mPrice" step="500" min="0" placeholder="12000"></label>
    <label>Телефон / контакт<input type="text" id="mPhone" placeholder="+7 900 000-00-00"></label>
    <label>Комментарий<textarea id="mComment" rows="2" placeholder="Заметки"></textarea></label>
    <div class="modal-actions">
      <button class="btn-danger" id="modalDelete" onclick="deleteModalEntry()" hidden>Удалить</button>
      <button class="btn-ghost" onclick="closeEntryModal()">Отмена</button>
      <button class="btn-accent" onclick="saveModalEntry()">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="secModal" hidden>
  <div class="modal-box">
    <h3 id="secModalTitle">Новое личное событие</h3>
    <label>Дата<input type="date" id="sDate"></label>
    <label>Время<input type="time" id="sTime"></label>
    <label>Что<input type="text" id="sTitle" placeholder="Например: Врач"></label>
    <label>Продолжительность, ч<input type="number" id="sDuration" step="0.5" min="0" placeholder="1"></label>
    <label>Комментарий<textarea id="sComment" rows="2" placeholder="Заметки"></textarea></label>
    <div class="modal-actions">
      <button class="btn-danger" id="secModalDelete" onclick="deleteSecEntry()" hidden>Удалить</button>
      <button class="btn-ghost" onclick="closeSecModal()">Отмена</button>
      <button class="btn-accent" onclick="saveSecEntry()">Сохранить</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
  const SB_URL = 'https://eqahyhujqbnbvdhgjmbz.supabase.co';
  const SB_KEY = 'sb_publishable_6VCLZQVP_JAiFRgoqkjsRQ_P7tKqsnr';
  const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  const DOW = ["ВС","ПН","ВТ","СР","ЧТ","ПТ","СБ"];
  const SOURCE_SUFFIX = {VK:"ВК",TG:"Т",WA:"W",MAX:"М"};

  let masterPin = localStorage.getItem('voodoo_pin') || null;
  let secretaryPin = localStorage.getItem('voodoo_sec_pin') || null;
  let mode = 'public'; // 'public' | 'master' | 'secretary'
  let bookings = []; // full rows in master mode
  let secRows = []; // rows in secretary mode
  let busyDates = new Set(); // public mode
  let today = new Date();
  let activeYear = today.getFullYear();
  let activeMonth = today.getMonth() + 1;
  let editingId = null;
  let secEditingId = null;
  let pinModalKind = 'master';
  let modalOpen = false;
  let toastTimer = null;
  let refreshTimer = null;
  let voiceRecognition = null;
  let voiceListening = false;

  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
  }

  async function rpc(name, body){
    const res = await fetch(`${SB_URL}/rest/v1/rpc/${name}`, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    const data = await res.json().catch(() => null);
    if (!res.ok){
      const msg = (data && (data.message || data.hint)) || ('HTTP ' + res.status);
      throw new Error(msg);
    }
    return data;
  }

  async function loadPublic(){
    const rows = await rpc('get_public_availability');
    busyDates = new Set((rows || []).map(r => r.booking_date));
  }

  async function loadMaster(){
    const rows = await rpc('master_list_bookings', {p_pin: masterPin});
    bookings = rows || [];
  }

  async function loadSecretary(){
    const rows = await rpc('secretary_list_bookings', {p_pin: secretaryPin});
    secRows = rows || [];
  }

  function fmtMoney(n){ return Math.round(n||0).toLocaleString('ru-RU') + ' ₽'; }
  function pad(n){ return String(n).padStart(2,'0'); }
  function dateStr(y,m,d){ return `${y}-${pad(m)}-${pad(d)}`; }
  function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
  function weekday(y,m,d){ return new Date(y, m-1, d).getDay(); }
  function isToday(y,m,d){ return today.getFullYear()===y && today.getMonth()+1===m && today.getDate()===d; }

  function monthList(){
    // current month .. +5 months ahead, across year boundary
    const out = [];
    for (let i=0;i<6;i++){
      let m = activeMonth0Base(i);
      out.push(m);
    }
    return out;
  }
  function activeMonth0Base(i){
    const base = today.getMonth() + i;
    return { year: today.getFullYear() + Math.floor(base/12), month: (base%12)+1 };
  }

  function renderMonthTabs(){
    const el = document.getElementById('monthTabs');
    el.innerHTML = '';
    const list = monthList();
    list.forEach(({year,month}) => {
      const btn = document.createElement('button');
      btn.className = 'month-tab' + (month===activeMonth && year===activeYear ? ' active' : '');
      btn.textContent = MONTHS[month-1] + (year !== today.getFullYear() ? ' ' + year : '');
      btn.onclick = () => { activeMonth = month; activeYear = year; renderAll(); };
      el.appendChild(btn);
    });
  }

  function renderSummary(){
    const summaryEl = document.getElementById('monthSummary');
    if (mode !== 'master'){ summaryEl.hidden = true; return; }
    summaryEl.hidden = false;
    const monthBookings = bookings.filter(b => b.booking_date.slice(0,7) === `${activeYear}-${pad(activeMonth)}`);
    const clientBookings = monthBookings.filter(b => !b.is_personal);
    const total = clientBookings.reduce((s,b) => s + (Number(b.price)||0), 0);
    const bookedDays = new Set(monthBookings.map(b => b.booking_date)).size;
    const nDays = daysInMonth(activeYear, activeMonth);
    const avgSession = clientBookings.length ? total/clientBookings.length : 0;
    const avgDay = total / nDays;
    summaryEl.innerHTML = `
      <div class="stat"><span>Занято дней</span><b>${bookedDays} из ${nDays}</b></div>
      <div class="stat"><span>Сеансов</span><b>${clientBookings.length}</b></div>
      <div class="stat"><span>Сумма по записям</span><b>${fmtMoney(total)}</b></div>
      <div class="stat"><span>Средний чек</span><b>${fmtMoney(avgSession)}</b></div>
      <div class="stat"><span>Среднее в календарный день</span><b>${fmtMoney(avgDay)}</b></div>
    `;
  }

  function renderDayList(){
    const list = document.getElementById('dayList');
    list.innerHTML = '';
    const nDays = daysInMonth(activeYear, activeMonth);
    const monthKey = `${activeYear}-${pad(activeMonth)}`;
    const monthBookings = mode==='master' ? bookings.filter(b => b.booking_date.slice(0,7) === monthKey) : [];
    const monthSecRows = mode==='secretary' ? secRows.filter(r => r.booking_date.slice(0,7) === monthKey) : [];

    for (let d=1; d<=nDays; d++){
      const dow = weekday(activeYear, activeMonth, d);
      const weekend = dow===0 || dow===6;
      const ds = dateStr(activeYear, activeMonth, d);

      let dayEntries = [];
      let busy = false;
      if (mode==='master'){
        dayEntries = monthBookings.filter(b => b.booking_date === ds).sort((a,b)=> (a.start_time||'').localeCompare(b.start_time||''));
        busy = dayEntries.length>0;
      } else if (mode==='secretary'){
        dayEntries = monthSecRows.filter(r => r.booking_date === ds).sort((a,b)=> (a.start_time||'').localeCompare(b.start_time||''));
        busy = dayEntries.length>0;
      } else {
        busy = busyDates.has(ds);
      }

      const row = document.createElement('div');
      row.className = 'day-row' + (weekend?' weekend':'') + (isToday(activeYear,activeMonth,d)?' today':'') + (!busy?' free':'');

      let inner = `<div class="day-date"><span class="day-num">${d}</span><span class="day-dow">${DOW[dow]}</span></div>`;

      if (mode==='master'){
        if (dayEntries.length===0){
          inner += `<button class="day-empty-btn" onclick="openEntryModal(null,'${ds}')">Свободно <span>+</span></button>`;
        } else {
          inner += '<div class="day-entries">' + dayEntries.map(b => {
            if (b.is_personal){
              return `<div class="entry entry-personal">
                <div class="entry-main">
                  <span class="entry-time">${b.start_time||''}</span>
                  <span class="entry-client">🏠 ${escapeHtml(b.client_name||'Личное')}</span>
                  ${b.duration_hours!=null ? `<span class="entry-price">${b.duration_hours} ч</span>` : ''}
                </div>
                ${b.notes ? `<div class="entry-sub">${escapeHtml(b.notes)}</div>` : ''}
              </div>`;
            }
            const suffix = SOURCE_SUFFIX[b.source] || (b.source||'');
            const sub = [b.notes, b.phone].filter(Boolean).join(' · ');
            return `<div class="entry" onclick="openEntryModal('${b.id}', null)">
              <div class="entry-main">
                <span class="entry-time">${b.start_time||''}</span>
                <span class="entry-client">${escapeHtml(b.client_name||'')} ${suffix}.</span>
                <span class="entry-price">${fmtMoney(b.price)}</span>
              </div>
              ${sub ? `<div class="entry-sub">${escapeHtml(sub)}</div>` : ''}
            </div>`;
          }).join('') + `<button class="day-add-btn" onclick="openEntryModal(null,'${ds}')">+ Добавить запись</button></div>`;
        }
      } else if (mode==='secretary'){
        if (dayEntries.length===0){
          inner += `<button class="day-empty-btn" onclick="openSecModal(null,'${ds}')">Свободно <span>+</span></button>`;
        } else {
          inner += '<div class="day-entries">' + dayEntries.map(r => {
            if (r.is_personal){
              return `<div class="entry entry-personal" onclick="openSecModal('${r.id}', null)">
                <div class="entry-main">
                  <span class="entry-time">${r.start_time||''}</span>
                  <span class="entry-client">🏠 ${escapeHtml(r.title||'Личное')}</span>
                  ${r.duration_hours!=null ? `<span class="entry-price">${r.duration_hours} ч</span>` : ''}
                </div>
                ${r.notes ? `<div class="entry-sub">${escapeHtml(r.notes)}</div>` : ''}
              </div>`;
            }
            return `<div class="entry-readonly"><span class="entry-time">${r.start_time||''}</span> занято${r.duration_hours!=null ? ' · '+r.duration_hours+' ч' : ''}</div>`;
          }).join('') + `<button class="day-add-btn" onclick="openSecModal(null,'${ds}')">+ Добавить</button></div>`;
        }
      } else {
        inner += busy
          ? `<div class="day-status">занято</div>`
          : `<div class="day-status free-label">свободно</div>`;
      }

      row.innerHTML = inner;
      list.appendChild(row);
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderAll(){
    renderMonthTabs();
    renderSummary();
    renderDayList();
    const subText = mode==='master' ? 'Режим мастера — полная сводка' : (mode==='secretary' ? 'Режим секретаря' : 'Свободные даты записи');
    document.getElementById('brandSub').textContent = subText;
    document.getElementById('masterBtn').textContent = mode==='master' ? 'Выйти из режима мастера' : 'Войти как мастер';
    document.getElementById('masterBtn').classList.toggle('on', mode==='master');
    document.getElementById('secBtn').textContent = mode==='secretary' ? 'Выйти из режима секретаря' : 'Секретарь';
    document.getElementById('secBtn').classList.toggle('on', mode==='secretary');
    document.getElementById('ctaBlock').hidden = mode!=='public';
    document.getElementById('voiceRow').classList.toggle('show', mode==='master');
  }

  function onMasterBtnClick(){
    if (mode === 'master'){
      masterPin = null;
      localStorage.removeItem('voodoo_pin');
      mode = 'public';
      loadPublic().then(renderAll).catch(e => showToast('Ошибка: ' + e.message));
      return;
    }
    if (masterPin){
      rpc('master_list_bookings', {p_pin: masterPin}).then(rows => {
        bookings = rows || []; mode = 'master'; renderAll();
      }).catch(() => {
        masterPin = null; localStorage.removeItem('voodoo_pin'); openPinModal('master');
      });
    } else {
      openPinModal('master');
    }
  }

  function onSecBtnClick(){
    if (mode === 'secretary'){
      secretaryPin = null;
      localStorage.removeItem('voodoo_sec_pin');
      mode = 'public';
      loadPublic().then(renderAll).catch(e => showToast('Ошибка: ' + e.message));
      return;
    }
    if (secretaryPin){
      rpc('secretary_list_bookings', {p_pin: secretaryPin}).then(rows => {
        secRows = rows || []; mode = 'secretary'; renderAll();
      }).catch(() => {
        secretaryPin = null; localStorage.removeItem('voodoo_sec_pin'); openPinModal('secretary');
      });
    } else {
      openPinModal('secretary');
    }
  }

  function openPinModal(kind){
    pinModalKind = kind;
    document.getElementById('pinModalTitle').textContent = kind==='master' ? 'Режим мастера' : 'Режим секретаря';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinModal').hidden = false;
    modalOpen = true;
    setTimeout(() => document.getElementById('pinInput').focus(), 50);
  }
  function closePinModal(){ document.getElementById('pinModal').hidden = true; modalOpen = false; }

  async function submitPin(){
    const val = document.getElementById('pinInput').value.trim();
    if (!val){ return; }
    try {
      if (pinModalKind === 'master'){
        const rows = await rpc('master_list_bookings', {p_pin: val});
        masterPin = val;
        localStorage.setItem('voodoo_pin', val);
        bookings = rows || [];
        mode = 'master';
      } else {
        const rows = await rpc('secretary_list_bookings', {p_pin: val});
        secretaryPin = val;
        localStorage.setItem('voodoo_sec_pin', val);
        secRows = rows || [];
        mode = 'secretary';
      }
      closePinModal();
      renderAll();
      showToast('Вход выполнен');
    } catch(e){
      showToast('Неверный пинкод');
    }
  }

  function openEntryModal(id, prefillDate, voice){
    editingId = id || null;
    const entry = id ? bookings.find(b => b.id === id) : null;
    document.getElementById('mDate').value = (voice && voice.date) ? voice.date : (entry ? entry.booking_date : (prefillDate || dateStr(activeYear,activeMonth,1)));
    document.getElementById('mTime').value = (voice && voice.time) ? voice.time : (entry ? (entry.start_time||'12:00') : '12:00');
    document.getElementById('mClient').value = (voice && voice.name) ? voice.name : (entry ? (entry.client_name||'') : '');
    document.getElementById('mSource').value = (voice && voice.source) ? voice.source : (entry ? (entry.source||'VK') : 'VK');
    document.getElementById('mPrice').value = (voice && voice.price!=null) ? voice.price : (entry ? (entry.price!=null ? entry.price : '') : '');
    document.getElementById('mPhone').value = entry ? (entry.phone||'') : '';
    document.getElementById('mComment').value = entry ? (entry.notes||'') : '';
    document.getElementById('modalTitle').textContent = entry ? 'Изменить запись' : 'Новая запись';
    document.getElementById('modalDelete').hidden = !entry;
    const hintEl = document.getElementById('modalVoiceHint');
    if (voice && voice.raw){
      hintEl.hidden = false;
      hintEl.textContent = '🎤 Распознано: «' + voice.raw + '» — проверь поля и нажми «Сохранить».';
    } else {
      hintEl.hidden = true;
    }
    document.getElementById('entryModal').hidden = false;
    modalOpen = true;
  }
  function closeEntryModal(){ document.getElementById('entryModal').hidden = true; modalOpen = false; editingId = null; document.getElementById('modalVoiceHint').hidden = true; }

  async function saveModalEntry(){
    const bDate = document.getElementById('mDate').value;
    const time = document.getElementById('mTime').value.trim();
    const client = document.getElementById('mClient').value.trim();
    const source = document.getElementById('mSource').value;
    const priceRaw = document.getElementById('mPrice').value;
    const price = priceRaw === '' ? 0 : parseFloat(priceRaw);
    const phone = document.getElementById('mPhone').value.trim();
    const comment = document.getElementById('mComment').value.trim();
    if (!bDate || !time || !client){ showToast('Заполни дату, время и имя клиента.'); return; }
    try {
      await rpc('master_upsert_booking', {
        p_pin: masterPin, p_id: editingId, p_booking_date: bDate, p_start_time: time,
        p_client_name: client, p_phone: phone || null, p_source: source,
        p_service: null, p_price: price, p_status: 'booked', p_notes: comment || null
      });
      closeEntryModal();
      await loadMaster();
      renderAll();
      showToast('Сохранено ✓');
    } catch(e){ showToast('Ошибка сохранения: ' + e.message); }
  }

  async function deleteModalEntry(){
    if (!editingId) return;
    try {
      await rpc('master_delete_booking', {p_pin: masterPin, p_id: editingId});
      closeEntryModal();
      await loadMaster();
      renderAll();
      showToast('Удалено');
    } catch(e){ showToast('Ошибка удаления: ' + e.message); }
  }

  function openSecModal(id, prefillDate){
    secEditingId = id || null;
    const entry = id ? secRows.find(r => r.id === id) : null;
    document.getElementById('sDate').value = entry ? entry.booking_date : (prefillDate || dateStr(activeYear,activeMonth,1));
    document.getElementById('sTime').value = entry ? (entry.start_time||'12:00') : '12:00';
    document.getElementById('sTitle').value = entry ? (entry.title||'') : '';
    document.getElementById('sDuration').value = entry && entry.duration_hours!=null ? entry.duration_hours : '';
    document.getElementById('sComment').value = entry ? (entry.notes||'') : '';
    document.getElementById('secModalTitle').textContent = entry ? 'Изменить событие' : 'Новое личное событие';
    document.getElementById('secModalDelete').hidden = !entry;
    document.getElementById('secModal').hidden = false;
    modalOpen = true;
  }
  function closeSecModal(){ document.getElementById('secModal').hidden = true; modalOpen = false; secEditingId = null; }

  async function saveSecEntry(){
    const bDate = document.getElementById('sDate').value;
    const time = document.getElementById('sTime').value.trim();
    const title = document.getElementById('sTitle').value.trim();
    const durRaw = document.getElementById('sDuration').value;
    const duration = durRaw === '' ? null : parseFloat(durRaw);
    const comment = document.getElementById('sComment').value.trim();
    if (!bDate || !time || !title){ showToast('Заполни дату, время и что за событие.'); return; }
    try {
      await rpc('secretary_upsert_personal_block', {
        p_pin: secretaryPin, p_id: secEditingId, p_booking_date: bDate, p_start_time: time,
        p_duration_hours: duration, p_title: title, p_notes: comment || null
      });
      closeSecModal();
      await loadSecretary();
      renderAll();
      showToast('Сохранено ✓');
    } catch(e){ showToast('Ошибка сохранения: ' + e.message); }
  }

  async function deleteSecEntry(){
    if (!secEditingId) return;
    try {
      await rpc('secretary_delete_personal_block', {p_pin: secretaryPin, p_id: secEditingId});
      closeSecModal();
      await loadSecretary();
      renderAll();
      showToast('Удалено');
    } catch(e){ showToast('Ошибка удаления: ' + e.message); }
  }

  // ---- Voice commands (master mode only) ----
  const MONTH_PATTERNS = [
    [/январ/, 1], [/феврал/, 2], [/март/, 3], [/апрел/, 4], [/ма[яй]/, 5],
    [/июн/, 6], [/июл/, 7], [/август/, 8], [/сентябр/, 9], [/октябр/, 10],
    [/ноябр/, 11], [/декабр/, 12]
  ];

  function normalizeRu(s){ return (s||'').toLowerCase().replace(/ё/g,'е').trim(); }

  function getSpeechRecognitionCtor(){
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
  }

  function toggleVoiceCommand(){
    if (mode !== 'master') return;
    if (voiceListening){ stopVoiceCommand(); return; }
    startVoiceCommand();
  }

  function startVoiceCommand(){
    const Ctor = getSpeechRecognitionCtor();
    if (!Ctor){ showToast('Голосовой ввод не поддерживается в этом браузере. Используй Chrome.'); return; }
    if (modalOpen) return;
    try {
      voiceRecognition = new Ctor();
      voiceRecognition.lang = 'ru-RU';
      voiceRecognition.interimResults = false;
      voiceRecognition.maxAlternatives = 1;
      voiceRecognition.continuous = false;
      voiceRecognition.onstart = () => {
        voiceListening = true;
        const btn = document.getElementById('voiceBtn');
        btn.classList.add('listening');
        btn.textContent = '⏹ Слушаю…';
      };
      voiceRecognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        handleVoiceTranscript(transcript);
      };
      voiceRecognition.onerror = (event) => {
        if (event.error === 'not-allowed' || event.error === 'permission-denied'){
          showToast('Нет доступа к микрофону — разреши его в настройках браузера.');
        } else if (event.error === 'no-speech'){
          showToast('Не расслышал — попробуй ещё раз.');
        } else {
          showToast('Ошибка распознавания: ' + event.error);
        }
      };
      voiceRecognition.onend = () => {
        voiceListening = false;
        const btn = document.getElementById('voiceBtn');
        btn.classList.remove('listening');
        btn.textContent = '🎤 Голосом';
      };
      voiceRecognition.start();
    } catch(e){
      showToast('Не удалось запустить распознавание: ' + e.message);
    }
  }

  function stopVoiceCommand(){
    if (voiceRecognition) voiceRecognition.stop();
  }

  function findMatchingBookings(nameGuess, dateGuess){
    if (!nameGuess) return [];
    const needle = normalizeRu(nameGuess);
    const stem = needle.slice(0, Math.max(3, needle.length - 2));
    let matches = bookings.filter(b => !b.is_personal && b.status !== 'cancelled' && normalizeRu(b.client_name).startsWith(stem));
    if (dateGuess){
      const byDate = matches.filter(b => b.booking_date === dateGuess);
      if (byDate.length) matches = byDate;
    }
    return matches;
  }

  function parseVoiceCommand(rawText){
    const text = rawText.toLowerCase();
    let action = 'create';
    if (/отмен|удал/.test(text)) action = 'cancel';
    else if (/перенес|перенос|измени|поменяй/.test(text)) action = 'edit';

    // date: first "<day> <month-word>" pair whose word matches a known month
    let date = null, dateMatchStr = '';
    const dateRe = /(\d{1,2})\s*(?:-?(?:го|е|ое))?\s+([а-яё]+)/gi;
    let m;
    while ((m = dateRe.exec(text)) !== null){
      const day = parseInt(m[1], 10);
      const word = m[2];
      const found = MONTH_PATTERNS.find(([rx]) => rx.test(word));
      if (found && day >= 1 && day <= 31){
        const month = found[1];
        let year = today.getFullYear();
        const candidate = new Date(year, month - 1, day);
        const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        if (candidate < todayMidnight) year += 1;
        date = dateStr(year, month, day);
        dateMatchStr = m[0];
        break;
      }
    }
    const rest = dateMatchStr ? text.replace(dateMatchStr, ' ') : text;

    // time
    let time = null;
    let timeMatch = rest.match(/(\d{1,2})\s*[:.]\s*(\d{2})/);
    if (timeMatch){
      time = pad(parseInt(timeMatch[1],10)) + ':' + timeMatch[2];
    } else {
      timeMatch = rest.match(/(\d{1,2})\s*час(?:ов|а)?/);
      if (timeMatch){ time = pad(parseInt(timeMatch[1],10)) + ':00'; }
    }
    const restNoTime = timeMatch ? rest.replace(timeMatch[0], ' ') : rest;

    // price
    let price = null;
    let priceMatch = restNoTime.match(/(\d{1,3})\s*(?:тысяч|тыс\.?|к(?![а-яё]))/);
    if (priceMatch){
      price = parseInt(priceMatch[1],10) * 1000;
    } else {
      priceMatch = restNoTime.match(/(\d{4,6})\s*(?:руб|₽)?/);
      if (priceMatch){ price = parseInt(priceMatch[1],10); }
    }

    // source
    let source = null;
    if (/вконтакте|(?<![а-яё])вк(?![а-яё])/.test(text)) source = 'VK';
    else if (/телеграм|telegram|(?<![а-яё])тг(?![а-яё])/.test(text)) source = 'TG';
    else if (/вотсап|ватсап|whatsapp|(?<![a-z])wa(?![a-z])/.test(text)) source = 'WA';
    else if (/(?<![а-яё])макс(?![а-яё])|(?<![a-z])max(?![a-z])/.test(text)) source = 'MAX';

    // name
    let name = null;
    let nm = text.match(/(?:запиши|запись)\s+([а-яё]+)\s+на(?![а-яё])/);
    if (!nm) nm = text.match(/сеанс\s+([а-яё]+)/);
    if (!nm && action === 'cancel') nm = text.match(/(?:отмени|отменить|удали|удалить)(?:\s+запись)?\s+(?:у\s+)?([а-яё]+)/);
    if (!nm && action === 'edit') nm = text.match(/перенес[а-я]*\s+([а-яё]+)/);
    if (!nm) nm = text.match(/запиши\s+([а-яё]+)/);
    if (nm){ name = nm[1]; }

    // fallback: no command-word pattern matched (e.g. free-form "2 октября, 12 часов, 6 тыс, Виталий") —
    // take whatever's left after stripping date/time/price/source substrings and filler words.
    if (!name){
      let residual = text;
      if (dateMatchStr) residual = residual.replace(dateMatchStr, ' ');
      if (timeMatch) residual = residual.replace(timeMatch[0], ' ');
      if (priceMatch) residual = residual.replace(priceMatch[0], ' ');
      residual = residual.replace(/вконтакте|(?<![а-яё])вк(?![а-яё])|телеграм|telegram|(?<![а-яё])тг(?![а-яё])|вотсап|ватсап|whatsapp|(?<![a-z])wa(?![a-z])|(?<![а-яё])макс(?![а-яё])|(?<![a-z])max(?![a-z])/g, ' ');
      residual = residual.replace(/[,.\-!?;:]/g, ' ');
      const STOPWORDS = new Set(['на','в','и','у','к','с','по','для','это','число','месяц','рублей','руб','тысяч','тыс','часов','час','часа','минут','мин','запись','запиши','записать','сеанс','отмени','отменить','удали','удалить','перенеси','перенести','измени','поменяй','пожалуйста']);
      const words = residual.split(/\s+/).filter(w => /^[а-яё]+$/.test(w) && w.length > 1 && !STOPWORDS.has(w));
      if (words.length){ name = words[0]; }
    }
    if (name){ name = name.charAt(0).toUpperCase() + name.slice(1); }

    return { action, date, time, name, source, price, raw: rawText };
  }

  function handleVoiceTranscript(text){
    const parsed = parseVoiceCommand(text);
    if (parsed.action === 'cancel' || parsed.action === 'edit'){
      const matches = findMatchingBookings(parsed.name, parsed.date);
      if (matches.length === 1){
        openEntryModal(matches[0].id, null, {
          raw: text,
          date: parsed.action==='edit' ? parsed.date : null,
          time: parsed.action==='edit' ? parsed.time : null
        });
        if (parsed.action === 'cancel'){
          showToast('Похоже, хочешь отменить эту запись — нажми «Удалить», если верно.');
        }
        return;
      }
      if (matches.length > 1){
        showToast(`Нашлось ${matches.length} подходящих записи — открой нужную вручную.`);
        return;
      }
      showToast('Не нашёл такую запись — проверь имя или открой вручную.');
      return;
    }
    openEntryModal(null, null, {
      raw: text, date: parsed.date, time: parsed.time, name: parsed.name, source: parsed.source, price: parsed.price
    });
  }

  async function refreshLoop(){
    if (!modalOpen){
      try {
        if (mode==='master') await loadMaster();
        else if (mode==='secretary') await loadSecretary();
        else await loadPublic();
        renderAll();
      } catch(e){ /* silent */ }
    }
    refreshTimer = setTimeout(refreshLoop, 20000);
  }

  async function init(){
    try {
      if (masterPin){
        try { await loadMaster(); mode = 'master'; }
        catch(e){ masterPin = null; localStorage.removeItem('voodoo_pin'); await loadPublic(); mode = 'public'; }
      } else if (secretaryPin){
        try { await loadSecretary(); mode = 'secretary'; }
        catch(e){ secretaryPin = null; localStorage.removeItem('voodoo_sec_pin'); await loadPublic(); mode = 'public'; }
      } else {
        await loadPublic(); mode = 'public';
      }
    } catch(e){ showToast('Не удалось загрузить расписание'); }
    renderAll();
    refreshTimer = setTimeout(refreshLoop, 20000);
  }

  init();
</script>
